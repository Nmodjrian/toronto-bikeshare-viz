# GraphHopper 11.1; run from repository root.
graphhopper:
  datareader.file: data/osm/toronto.osm.pbf
  graph.location: data/graph-cache-bike
  profiles:
    - name: bike
      custom_model_files: []
  profiles_ch:
    - profile: bike
  graph.encoded_values: bike_access, bike_average_speed, bike_priority, bike_road_access, bike_network, ferry_speed, mtb_rating, hike_rating, country, road_class
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
